name: build-images
on:
  workflow_dispatch:
    inputs:
      replace_release:
        description: 'Replace existing development assets (if any)'
        required: false
        type: boolean
      generate_os_package_manifest:
        description: 'Generate OS package manifest and changelog files (adds ~100s to build time)'
        required: false
        type: boolean
        default: false
  pull_request:
  push:  
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
    branches: 
      - main  
    tags: 
      - 'v*'

permissions:
  contents: write  # Required for creating releases and uploading assets
  actions: read    # Required for workflow access

jobs:
  # Resolve component versions once: pinned in versions.env, else upstream latest
  resolve-tags:
    name: resolve component tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      snphost: ${{ steps.resolve.outputs.snphost }}
      snpguest: ${{ steps.resolve.outputs.snpguest }}
      beacon: ${{ steps.resolve.outputs.beacon }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tags (pin from versions.env, fallback to latest)
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Components to resolve. Each <name> is also the output name and, upper-cased,
          # the NAME_TAG variable in versions.env. These are all built into the images.
          components=(snphost snpguest beacon)
          declare -A repos=(
            [snphost]=virtee/snphost
            [snpguest]=virtee/snpguest
            [beacon]=AMDEPYC/beacon
          )
          # Release assets the mkosi.build scripts download
          declare -A assets=(
            [snphost]=snphost
            [snpguest]=snpguest
            [beacon]=beacon-linux-x86_64
          )

          # Variables allowed in versions.env, derived from the components above
          version_vars=()
          for name in "${components[@]}"; do
            version_vars+=("${name^^}_TAG")
          done

          # Excluded tags: tracked in versions.env but not resolved/validated in this step
          # (e.g., dispatch is not built into images, so not downloaded/checked here)
          excluded_tags=(DISPATCH_TAG)

          # All allowed variables (resolved + excluded)
          all_allowed_vars=("${version_vars[@]}" "${excluded_tags[@]}")

          # Reject anything other than comments, blank lines and NAME=TAG for known names,
          # so a typo'd name doesn't silently fall back to the upstream latest release
          alternatives=$(IFS='|'; echo "${all_allowed_vars[*]}")
          if bad=$(grep -nvE "^[[:space:]]*(#|\$)|^($alternatives)=[^[:space:]]*\$" versions.env); then
            echo "::error file=versions.env::Unexpected line(s); expected NAME=TAG with NAME one of ${all_allowed_vars[*]}"
            echo "$bad" >&2
            exit 1
          fi
          . versions.env

          # Pinned tags are looked up too, so a typo'd tag fails here rather than mid-build
          resolve() {  # $1=repo $2=pinned tag
            gh release view ${2:+"$2"} --repo "$1" --json tagName --jq '.tagName' || {
              echo "::error file=versions.env::Failed to resolve release ${2:-latest} of $1" >&2
              return 1
            }
          }

          # Check the release asset the mkosi.build scripts download is reachable
          # (first byte only, following redirects), so a release missing the asset
          # fails here rather than mid-build
          check_download() {  # $1=repo $2=tag $3=asset
            local url="https://github.com/$1/releases/download/$2/$3" code
            code=$(curl -sL -r 0-0 -o /dev/null -w '%{http_code}' "$url") || code=000
            case "$code" in
              200|206) echo "OK: $url" ;;
              *)
                echo "::error::Cannot download $url (HTTP $code); check that release $2 of $1 has asset $3"
                return 1
                ;;
            esac
          }

          declare -A tags
          summary=()
          for name in "${components[@]}"; do
            repo=${repos[$name]}
            pin_var="${name^^}_TAG"
            pinned="${!pin_var:-}"

            # Assign first so a failing resolve aborts the step under set -e
            tag=$(resolve "$repo" "$pinned")
            if [ -z "$tag" ] || [ "$tag" = "null" ]; then
              echo "::error::Failed to resolve release tag for $repo"
              exit 1
            fi
            tags[$name]=$tag
            source=${pinned:+pinned}; source=${source:-latest}
            summary+=("| $repo | $tag | $source |")
          done

          failed=0
          for name in "${components[@]}"; do
            check_download "${repos[$name]}" "${tags[$name]}" "${assets[$name]}" || failed=1
          done
          [ "$failed" -eq 0 ] || exit 1

          for name in "${components[@]}"; do
            echo "$name=${tags[$name]}" >> "$GITHUB_OUTPUT"
          done

          {
            echo "### Resolved component versions"
            echo
            echo "| Repository | Version | Source |"
            echo "|---|---|---|"
            printf '%s\n' "${summary[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Development release for tag or main pushes
  create-release:
    name: create new release for tagged or latest assets
    needs: resolve-tags
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.replace_release == 'true')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Recreate release(replace assets)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="devel"
            gh release delete "${TAG}" --cleanup-tag --yes || true
            while git fetch --tags --prune-tags; git tag -l | grep "^${TAG}$"; do
              sleep 2;
            done
            gh release create "${TAG}" \
              --title "Development Images" \
              --notes "Automated build of host and guest images from main branch." \
              --prerelease
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release delete "${TAG}" --cleanup-tag --yes || true
            while git fetch --tags --prune-tags; git tag -l | grep "^${TAG}$"; do
              sleep 2;
            done
            gh release create "${TAG}" \
              --title "SEV Certify ${TAG}" \
              --notes "OS images for ${TAG} certification"
          fi

  build:
    name: ${{ matrix.distro }}-${{ matrix.release }}
    needs: resolve-tags
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            release: 41
          - distro: ubuntu
            release: 25.04
          - distro: debian
            release: 13
          - distro: centos
            release: 10
          - distro: rocky
            release: 10
          - distro: debian
            release: forky
          - distro: ubuntu
            release: "25.10"
          - distro: ubuntu
            release: "26.04"
          - distro: opensuse
            release: "16.0"
          - distro: fedora
            release: "44"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo sed -i 's/noble/resolute/g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt update
          sudo apt install -y mkosi

      - name: Apply resolved release tags
        # Tags resolved once by the resolve-tags job (pinned in versions.env, else upstream latest).
        # Passed via env rather than interpolated into the script to avoid shell injection.
        env:
          SNPGUEST_TAG: ${{ needs.resolve-tags.outputs.snpguest }}
          BEACON_TAG: ${{ needs.resolve-tags.outputs.beacon }}
          SNPHOST_TAG: ${{ needs.resolve-tags.outputs.snphost }}
        run: |
          set -euo pipefail

          # mkosi.conf files to inject into; the component is the module directory name
          version_confs=(
            modules/build/common/snpguest/mkosi.conf
            modules/build/host/beacon/mkosi.conf
            modules/build/host/snphost/mkosi.conf
          )

          # Inject environment variables into mkosi.conf files
          for conf in "${version_confs[@]}"; do
            component=$(basename "$(dirname "$conf")")
            var="${component^^}_TAG"
            sed -i "/^\[Build\]/a\Environment=$var=${!var}" "$conf"
          done

      - name: Build guest-${{ matrix.distro }}-${{ matrix.release }}
        run: |
          sudo mkosi --image-id=guest-${{ matrix.distro }}-${{ matrix.release }} -C images/guest-${{ matrix.distro }}-${{ matrix.release }}/ cat-config
          sudo mkosi --image-id=guest-${{ matrix.distro }}-${{ matrix.release }} -C images/guest-${{ matrix.distro }}-${{ matrix.release }}/ summary
          # MKOSI_ENV accumulates --environment flags; add new case blocks to extend
          MKOSI_ENV=""
          case "${{ github.event.inputs.generate_os_package_manifest }}" in
            true) MKOSI_ENV="$MKOSI_ENV --environment=GENERATE_MANIFEST=yes";;
          esac
          sudo mkosi --image-id=guest-${{ matrix.distro }}-${{ matrix.release }} -C images/guest-${{ matrix.distro }}-${{ matrix.release }}/ build $MKOSI_ENV

      - name: Build host-${{ matrix.distro }}-${{ matrix.release }}
        run: |
          sudo mkosi --image-id=host-${{ matrix.distro }}-${{ matrix.release }} -C images/host-${{ matrix.distro }}-${{ matrix.release }}/ cat-config
          sudo mkosi --image-id=host-${{ matrix.distro }}-${{ matrix.release }} -C images/host-${{ matrix.distro }}-${{ matrix.release }}/ summary
          # MKOSI_ENV accumulates --environment flags; add new case blocks to extend
          MKOSI_ENV=""
          case "${{ github.event.inputs.generate_os_package_manifest }}" in
            true) MKOSI_ENV="$MKOSI_ENV --environment=GENERATE_MANIFEST=yes";;
          esac
          sudo mkosi --image-id=host-${{ matrix.distro }}-${{ matrix.release }} -C images/host-${{ matrix.distro }}-${{ matrix.release }}/ build $MKOSI_ENV

      - name: Stage artifacts for release (local copy)
        run: |        
          mkdir -p /tmp/release-artifacts
          cp images/guest-${{ matrix.distro }}-${{ matrix.release }}/guest-${{ matrix.distro }}-${{ matrix.release }}.efi /tmp/release-artifacts/guest-${{ matrix.distro }}-${{ matrix.release }}.efi
          cp images/host-${{ matrix.distro }}-${{ matrix.release }}/host-${{ matrix.distro }}-${{ matrix.release }}.efi /tmp/release-artifacts/host-${{ matrix.distro }}-${{ matrix.release }}.efi

      - name: Stage OS package manifests (if exists)
        if: github.event.inputs.generate_os_package_manifest == 'true'
        run: |
          mkdir -p /tmp/${{ matrix.distro }}-${{ matrix.release }}-package-manifests
          manifest_extensions=(manifest changelog)

          for ext in "${manifest_extensions[@]}"; do
            # Copy manifest files for guest image if they exist
            guest_manifest_file="images/guest-${{ matrix.distro }}-${{ matrix.release }}/guest-${{ matrix.distro }}-${{ matrix.release }}.$ext"
            if [ -f "$guest_manifest_file" ]; then cp "$guest_manifest_file" /tmp/${{ matrix.distro }}-${{ matrix.release }}-package-manifests/; else echo "Artifact not found: $guest_manifest_file"; fi

            # Copy manifest files for host image if they exist
            host_manifest_file="images/host-${{ matrix.distro }}-${{ matrix.release }}/host-${{ matrix.distro }}-${{ matrix.release }}.$ext"
            if [ -f "$host_manifest_file" ]; then cp "$host_manifest_file" /tmp/${{ matrix.distro }}-${{ matrix.release }}-package-manifests/; else echo "Artifact not found: $host_manifest_file"; fi
          done

      - name: Create and upload OS package manifest archives
        if: github.event.inputs.generate_os_package_manifest == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          zip -rj /tmp/${{ matrix.distro }}-${{ matrix.release }}-package-manifests.zip /tmp/${{ matrix.distro }}-${{ matrix.release }}-package-manifests/

          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="devel"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          gh release upload "${TAG}" \
            /tmp/${{ matrix.distro }}-${{ matrix.release }}-package-manifests.zip \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload guest assets (default content type)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.replace_release == 'true')
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="devel"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          gh release upload "${TAG}" /tmp/release-artifacts/guest-${{ matrix.distro }}-${{ matrix.release }}.efi --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload host assets (custom Content-Type)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.replace_release == 'true')
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="devel"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Get the release ID
          RELEASE_ID=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/"${TAG}" --jq .id)
          HOST_FILE="/tmp/release-artifacts/host-${{ matrix.distro }}-${{ matrix.release }}.efi"
          ASSET_NAME=$(basename "$HOST_FILE")

          # Look for an existing asset with the same name
          ASSET_ID=$(gh api \
            repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets \
            --jq ".[] | select(.name==\"$ASSET_NAME\") | .id")

          # If found, delete it
          if [ -n "$ASSET_ID" ]; then
            gh api \
              --method DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID
            fi

          # Upload the new asset with the correct Content-Type
          curl --fail -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.dispatch+efi" \
            --data-binary @"$HOST_FILE" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ASSET_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

